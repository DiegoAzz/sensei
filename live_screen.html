<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Sensei del Amor · Holograma en Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.55);
      --crimson: #ff2a6d;
      --crimson-glow: rgba(255, 42, 109, 0.55);
      --bg: #030005;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-luxury: 'Cinzel', serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Zona segura oficial de TikTok LIVE Studio (Top bar: 94px, Bottom chat: 511px) */
      --tiktok-top-safe: 104px;
      --tiktok-bottom-safe: 511px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: #fff;
    }

    /* ==================== MODO RESPONSIVO INTELIGENTE (PC Y MÓVIL) ==================== */

    /* 1. EN PC / NAVEGADOR HORIZONTAL: Centrado en marco vertical 9:16 elegante */
    @media (min-aspect-ratio: 1/1) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #16021e 0%, #030005 85%);
      }
      .stream-viewport {
        height: 94vh;
        max-height: 960px;
        aspect-ratio: 9 / 16;
        border-radius: 28px;
        box-shadow: 
          0 0 50px rgba(255, 42, 109, 0.28), 
          0 0 100px rgba(255, 215, 0, 0.15),
          0 25px 70px rgba(0, 0, 0, 0.95);
        border: 2px solid rgba(255, 215, 0, 0.35);
      }
    }

    /* 2. EN MÓVIL / TIKTOK LIVE STUDIO: 100% Pantalla completa sin bordes ni recortes */
    @media (max-aspect-ratio: 1/1) {
      body, html {
        width: 100%;
        height: 100%;
      }
      .stream-viewport {
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    .stream-viewport {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 32%, #1e0326 0%, #030005 70%);
      display: flex;
      flex-direction: column;
    }

    /* Fondo de Partículas Cósmicas / Polvo Dorado y Carmesí */
    #starfield-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ==================== FLUJO VERTICAL FLEXBOX (CERO SUPERPOSICIONES / NUNCA SE MONTAN) ==================== */
    .stream-content-flow {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: var(--tiktok-top-safe);
      padding-left: 18px;
      padding-right: 18px;
      z-index: 20;
    }

    /* 1. HEADER SUPERIOR */
    .holo-header {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .holo-title {
      font-size: clamp(19px, 2.6vw, 28px);
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 42, 109, 0.85), 0 0 35px rgba(255, 215, 0, 0.5);
      line-height: 1.15;
      max-width: 100%;
      word-break: break-word;
    }

    .holo-subtitle {
      font-size: clamp(11.5px, 1.35vw, 14.5px);
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.2px;
      line-height: 1.3;
      max-width: 95%;
    }

    .holo-meta-row {
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
      font-family: var(--font-mono);
      flex-wrap: wrap;
    }

    .live-dot-pulse {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff2a6d;
      box-shadow: 0 0 10px #ff2a6d;
      animation: liveBlink 1.4s ease-in-out infinite;
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .holo-meta-tag {
      color: #ffd700;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    /* Toast Flotante al Entrar Espectador */
    .holo-join-pill {
      position: absolute;
      top: calc(var(--tiktok-top-safe) + 68px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 42, 109, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.55);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 42, 109, 0.35);
      animation: toastIn 0.35s ease-out;
      z-index: 30;
      white-space: nowrap;
    }

    @keyframes toastIn {
      0% { opacity: 0; transform: translate(-50%, -8px) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    /* 2. ESCENARIO CENTRAL HOLOGRÁFICO (SECUENCIAL, NUNCA SE MONTA) */
    .holo-stage {
      position: relative;
      width: 100%;
      height: clamp(180px, 24vh, 250px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* A) EL PRIMER SÍMBOLO: ORBE HOLOGRÁFICO EN REPOSO */
    .holo-core-container {
      position: absolute;
      width: clamp(190px, 25vh, 260px);
      height: clamp(190px, 25vh, 260px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: scale(1);
    }

    #holo-orb-canvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 35px rgba(255, 42, 109, 0.75)) drop-shadow(0 0 65px rgba(255, 215, 0, 0.5));
    }

    /* B) EL SENSEI HOLOGRÁFICO HABLANDO (SIN MARCOS NI CÍRCULOS) */
    .holo-sensei-container {
      position: absolute;
      width: clamp(210px, 27vh, 280px);
      height: clamp(210px, 27vh, 280px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
    }

    .holo-avatar-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: holoFloat 3.2s ease-in-out infinite;
      -webkit-mask-image: radial-gradient(ellipse 46% 46% at 50% 45%, black 25%, rgba(0,0,0,0.7) 45%, transparent 64%);
      mask-image: radial-gradient(ellipse 46% 46% at 50% 45%, black 25%, rgba(0,0,0,0.7) 45%, transparent 64%);
    }

    .holo-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      mix-blend-mode: screen;
      filter: 
        drop-shadow(0 0 25px rgba(255, 42, 109, 0.85))
        drop-shadow(0 0 45px rgba(255, 215, 0, 0.55))
        brightness(1.15) 
        contrast(1.15);
      transition: transform 0.12s ease-out;
    }

    .holo-scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 215, 0, 0) 50%,
        rgba(255, 42, 109, 0.18) 51%,
        rgba(0, 0, 0, 0.3) 52%
      );
      background-size: 100% 5px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }

    .holo-beam {
      position: absolute;
      top: -100%;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(180deg, transparent, rgba(255, 215, 0, 0.45), transparent);
      animation: scanBeam 2.8s linear infinite;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes scanBeam {
      0% { top: -40%; }
      100% { top: 120%; }
    }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.02); }
    }

    body.is-speaking .holo-core-container {
      opacity: 0;
      transform: scale(0.45);
      filter: blur(6px);
    }

    body.is-speaking .holo-sensei-container {
      opacity: 1;
      transform: scale(1);
    }

    /* ==================== 3. TARJETA DE RESPUESTA Y PREGUNTA DISCRETA ==================== */
    .holo-response-area {
      position: relative;
      width: 100%;
      max-width: 96%;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .holo-user-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 0.2px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .holo-user-badge .prefix-label {
      color: #ff2a6d;
      font-weight: 800;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(255, 42, 109, 0.16);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 42, 109, 0.35);
    }

    /* PREGUNTA DEL USUARIO (FUENTE PEQUEÑA, DISCRETA Y ELEGANTE) */
    .holo-user-question-box {
      font-size: clamp(11px, 1.35vh, 13px);
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 6px;
      padding: 3px 10px;
      max-width: 92%;
      margin: 0 auto;
      line-height: 1.35;
      font-style: italic;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      word-break: break-word;
    }

    .holo-user-question-box .q-icon {
      font-size: 12px;
      opacity: 0.85;
    }

    /* VEREDICTO DEL SENSEI (FUENTE GRANDE, CLARA Y PROMINENTE) */
    .holo-answer-box {
      font-size: clamp(15px, 2.0vh, 21px);
      font-weight: 700;
      line-height: 1.42;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      max-width: 96%;
      margin: 0 auto;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .holo-answer-box.is-vip {
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.65);
    }

    .holo-answer-box.is-speaking-text {
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 42, 109, 0.75), 0 0 30px rgba(255, 215, 0, 0.35);
    }

    /* ZONA INFERIOR TOTALMENTE LIBRE PARA EL CHAT DE TIKTOK LIVE (~511px) */
    .tiktok-chat-safe-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--tiktok-bottom-safe);
      pointer-events: none;
      z-index: 5;
    }

    /* Botón flotante para activar audio si el navegador bloquea autoplay */
    .audio-unlock-btn {
      position: absolute;
      top: calc(var(--tiktok-top-safe) + 12px);
      right: 18px;
      z-index: 100;
      background: rgba(255, 42, 109, 0.35);
      border: 1.5px solid #ffd700;
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.45);
      animation: pulseBtn 1.5s infinite alternate;
    }

    @keyframes pulseBtn {
      from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
      to { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 42, 109, 0.7); }
    }
  </style>
</head>
<body>

  <div class="stream-viewport">

    <!-- CANVAS FONDO ESTELAR DINÁMICO (POLVO DORADO Y CARMESÍ) -->
    <canvas id="starfield-canvas"></canvas>

    <!-- CONTENEDOR FLEX VERTICAL ÚNICO (CERO SUPERPOSICIONES / NUNCA SE MONTAN) -->
    <div class="stream-content-flow">

      <!-- 1. HEADER CENTRADO Y RESPONSIVO DEBAJO DEL TOP BAR DE TIKTOK (94px) -->
      <header class="holo-header">
        <h1 class="holo-title" id="hdr-title">⛩️ Pregúntale al Sensei</h1>
        <p class="holo-subtitle" id="hdr-subtitle">Escribe tu dilema de amor, ex o conquista</p>
        <div class="holo-meta-row">
          <span class="live-dot-pulse"></span>
          <span>EN VIVO</span>
          <span id="live-clock">--:--:--</span>
          <span>·</span>
          <span id="live-viewers">12 en el Dojo</span>
          <span>·</span>
          <span class="holo-meta-tag" id="live-stats">Consultorio Activo</span>
        </div>
      </header>

      <!-- TOAST DE SALUDO FLOTANTE -->
      <div class="holo-join-pill" id="join-pill" style="display: none;">
        <span>👋</span>
        <span id="join-pill-text">¡Bienvenido al dojo!</span>
      </div>

      <!-- 2. ESCENARIO CENTRAL HOLOGRÁFICO -->
      <div class="holo-stage">
        <!-- A) PRIMER SÍMBOLO: CORE / ORBE HOLOGRÁFICO EN REPOSO -->
        <div class="holo-core-container" id="holo-core">
          <canvas id="holo-orb-canvas" width="400" height="400"></canvas>
        </div>

        <!-- B) EL SENSEI HOLOGRÁFICO HABLANDO (SILUETA FLOTANTE DIFUMINADA) -->
        <div class="holo-sensei-container" id="holo-sensei">
          <div class="holo-avatar-wrap">
            <div class="holo-scanlines"></div>
            <div class="holo-beam"></div>
            <img id="holo-avatar-img" class="holo-avatar-img" src="/assets/logo_circle.png" alt="El Sensei">
          </div>
        </div>
      </div>

      <!-- 3. TARJETA DE RESPUESTA: PREGUNTA PEQUEÑA Y RESPUESTA DESTACADA -->
      <div class="holo-response-area">
        <div class="holo-user-badge" id="resp-user-badge">
          <span class="prefix-label" id="resp-prefix">ÚLTIMA RESPUESTA</span>
          <span id="resp-username">@espectador</span>
        </div>

        <!-- Pregunta del usuario (EN LETRA PEQUEÑA Y DISCRETA) -->
        <div class="holo-user-question-box" id="resp-user-question" style="display: none;">
          <span class="q-icon">💬</span>
          <span class="q-text" id="resp-user-question-text">«Pregunta del usuario»</span>
        </div>

        <!-- Veredicto del Sensei (EN LETRA GRANDE Y DESTACADA) -->
        <div class="holo-answer-box" id="resp-text">
          Deja tu caso de amor o pareja en los comentarios y te daré mi veredicto en directo.
        </div>
      </div>

    </div>

    <!-- ZONA INFERIOR LIBRE PARA EL CHAT DE TIKTOK LIVE (~511px) -->
    <div class="tiktok-chat-safe-zone"></div>

    <!-- BOTÓN DE DESBLOQUEO DE AUDIO PARA NAVEGADOR -->
    <button class="audio-unlock-btn" id="btn-unlock-audio" onclick="desbloquearAudio()">🔊 Activar Sonido</button>

    <!-- REPRODUCTOR DE VOZ DUAL-ENGINE -->
    <audio id="speech-audio" preload="auto" playsinline autoplay></audio>
    <audio id="bg-music" src="/assets/musica_misteriosa.mp3" loop preload="auto"></audio>

  </div>

  <script>
    // ==================== 1. RELOJ EN VIVO EN TIEMPO REAL ====================
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const el = document.getElementById("live-clock");
      if (el) el.textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==================== 2. FONDO DE ESTRELLAS Y POLVO CÓSMICO (CANVAS - ORO Y CARMESÍ) ====================
    const bgCanvas = document.getElementById("starfield-canvas");
    const bgCtx = bgCanvas ? bgCanvas.getContext("2d") : null;
    let stars = [];

    function resizeBgCanvas() {
      if (!bgCanvas) return;
      bgCanvas.width = bgCanvas.parentElement.clientWidth;
      bgCanvas.height = bgCanvas.parentElement.clientHeight;
      initStars();
    }
    window.addEventListener("resize", resizeBgCanvas);

    function initStars() {
      stars = [];
      const numStars = Math.floor((bgCanvas.width * bgCanvas.height) / 7500);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          size: Math.random() * 1.8 + 0.4,
          speed: Math.random() * 0.35 + 0.1,
          opacity: Math.random() * 0.7 + 0.2,
          pulseSpeed: Math.random() * 0.03 + 0.01,
          pulseVal: Math.random() * Math.PI,
          isGold: Math.random() > 0.4
        });
      }
    }

    function renderStarfield() {
      if (!bgCtx) return;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      for (let s of stars) {
        s.y -= s.speed;
        if (s.y < 0) {
          s.y = bgCanvas.height;
          s.x = Math.random() * bgCanvas.width;
        }
        s.pulseVal += s.pulseSpeed;
        const currentAlpha = s.opacity * (0.6 + 0.4 * Math.sin(s.pulseVal));
        bgCtx.fillStyle = s.isGold 
          ? `rgba(255, 215, 0, ${currentAlpha * 0.7})` 
          : `rgba(255, 42, 109, ${currentAlpha * 0.6})`;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        bgCtx.fill();
      }
      requestAnimationFrame(renderStarfield);
    }
    resizeBgCanvas();
    renderStarfield();

    // ==================== 3. EL PRIMER SÍMBOLO: CORE HOLOGRÁFICO EN REPOSO (ORO Y CARMESÍ) ====================
    const orbCanvas = document.getElementById("holo-orb-canvas");
    const orbCtx = orbCanvas ? orbCanvas.getContext("2d") : null;
    const NUM_ORB_POINTS = 185;
    let orbPoints = [];

    function initHoloOrb() {
      orbPoints = [];
      for (let i = 0; i < NUM_ORB_POINTS; i++) {
        const theta = Math.acos(2 * Math.random() - 1);
        const phi = Math.random() * Math.PI * 2;
        orbPoints.push({
          theta: theta,
          phi: phi,
          baseRadius: 105 + (Math.random() * 16 - 8),
          pulseOffset: Math.random() * Math.PI * 2,
          size: Math.random() * 2.2 + 1.1,
          colorType: i % 3
        });
      }
    }
    initHoloOrb();

    let orbRotY = 0;
    let orbRotX = 0.25;
    let orbTime = 0;

    function renderHoloOrb() {
      if (!orbCtx) return;
      orbCtx.clearRect(0, 0, orbCanvas.width, orbCanvas.height);

      const cx = orbCanvas.width / 2;
      const cy = orbCanvas.height / 2;
      orbTime += 0.022;
      orbRotY += 0.014;

      const grad = orbCtx.createRadialGradient(cx, cy, 10, cx, cy, 140);
      grad.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
      grad.addColorStop(0.35, 'rgba(255, 42, 109, 0.3)');
      grad.addColorStop(0.7, 'rgba(140, 10, 50, 0.1)');
      grad.addColorStop(1, 'transparent');
      orbCtx.fillStyle = grad;
      orbCtx.beginPath();
      orbCtx.arc(cx, cy, 140, 0, Math.PI * 2);
      orbCtx.fill();

      const breathing = 1.0 + 0.07 * Math.sin(orbTime * 1.6);

      for (let p of orbPoints) {
        const r = p.baseRadius * breathing;
        let x = r * Math.sin(p.theta) * Math.cos(p.phi);
        let y = r * Math.sin(p.theta) * Math.sin(p.phi);
        let z = r * Math.cos(p.theta);

        let x1 = x * Math.cos(orbRotY) - z * Math.sin(orbRotY);
        let z1 = x * Math.sin(orbRotY) + z * Math.cos(orbRotY);

        let y2 = y * Math.cos(orbRotX) - z1 * Math.sin(orbRotX);
        let z2 = y * Math.sin(orbRotX) + z1 * Math.cos(orbRotX);

        const fov = 340;
        const scale = fov / (fov + z2);
        const projX = cx + x1 * scale;
        const projY = cy + y2 * scale;

        const alpha = Math.max(0.15, (z2 + 130) / 260);

        if (p.colorType === 0) {
          orbCtx.fillStyle = `rgba(255, 215, 0, ${alpha * 0.95})`;
          orbCtx.shadowColor = '#ffd700';
        } else if (p.colorType === 1) {
          orbCtx.fillStyle = `rgba(255, 42, 109, ${alpha * 0.95})`;
          orbCtx.shadowColor = '#ff2a6d';
        } else {
          orbCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
          orbCtx.shadowColor = '#ffd700';
        }

        orbCtx.shadowBlur = 8 * scale;
        orbCtx.beginPath();
        orbCtx.arc(projX, projY, p.size * scale, 0, Math.PI * 2);
        orbCtx.fill();
        orbCtx.shadowBlur = 0;
      }

      requestAnimationFrame(renderHoloOrb);
    }
    renderHoloOrb();

    // ==================== 4. EL SENSEI HABLANDO ====================
    const avatarImg = document.getElementById("holo-avatar-img");
    const AVATAR_FRAMES = [
      "/assets/logo_circle_talk.png",
      "/assets/logo_circle.png",
      "/assets/logo_circle_talk.png",
      "/assets/logo_circle_laugh.png"
    ];
    let avatarAnimInterval = null;
    let currentFrameIdx = 0;

    function startSenseiTalkingAnimation(isSpeaking, emotion) {
      if (avatarAnimInterval) {
        clearInterval(avatarAnimInterval);
        avatarAnimInterval = null;
      }

      if (!avatarImg) return;

      if (isSpeaking) {
        currentFrameIdx = 0;
        avatarAnimInterval = setInterval(() => {
          currentFrameIdx = (currentFrameIdx + 1) % AVATAR_FRAMES.length;
          avatarImg.src = AVATAR_FRAMES[currentFrameIdx];
          const microScale = 1.0 + (Math.sin(Date.now() / 120) * 0.025);
          avatarImg.style.transform = `scale(${microScale})`;
        }, 175);
      } else {
        avatarImg.src = "/assets/logo_circle.png";
        avatarImg.style.transform = "scale(1.0)";
      }
    }

    // ==================== 5. MOTOR DE AUDIO DUAL-ENGINE ANTI-BLOQUEO ====================
    let audioCtx = null;
    const speechAudio = document.getElementById("speech-audio");
    const bgMusic = document.getElementById("bg-music");
    const btnUnlock = document.getElementById("btn-unlock-audio");
    let lastAudioVersion = 0;
    let initialLoadDone = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function reproducirAudioSensei(url) {
      if (!speechAudio) return;

      try {
        speechAudio.pause();
        speechAudio.currentTime = 0;
        speechAudio.src = url;
        speechAudio.volume = 1.0;
        const playPromise = speechAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("HTML5 audio bloqueado por navegador, activando WebAudio fallback:", err);
            try {
              const ctx = getAudioContext();
              if (ctx) {
                fetch(url)
                  .then(r => r.arrayBuffer())
                  .then(buf => ctx.decodeAudioData(buf))
                  .then(decoded => {
                    const source = ctx.createBufferSource();
                    source.buffer = decoded;
                    source.connect(ctx.destination);
                    source.start(0);
                  })
                  .catch(e => console.warn("WebAudio fallback err:", e));
              }
            } catch(e2) {}
            if (btnUnlock) btnUnlock.style.display = "block";
          });
        }
      } catch(e) {
        console.warn("Error audio:", e);
      }
    }

    function desbloquearAudio() {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
      if (speechAudio) {
        speechAudio.play().then(() => speechAudio.pause()).catch(() => {});
      }
      if (bgMusic) {
        bgMusic.volume = 0.04;
        bgMusic.play().catch(() => {});
      }
      if (btnUnlock) btnUnlock.style.display = "none";
    }

    document.addEventListener("click", () => desbloquearAudio());
    document.addEventListener("touchstart", () => desbloquearAudio());
    document.addEventListener("keydown", () => desbloquearAudio());

    // ==================== 6. POLLING DE ESTADO EN TIEMPO REAL ====================
    const hdrTitle = document.getElementById("hdr-title");
    const hdrSubtitle = document.getElementById("hdr-subtitle");
    const respPrefix = document.getElementById("resp-prefix");
    const respUsername = document.getElementById("resp-username");
    const respText = document.getElementById("resp-text");
    const respQuestionBox = document.getElementById("resp-user-question");
    const respQuestionText = document.getElementById("resp-user-question-text");
    const joinPill = document.getElementById("join-pill");
    const joinPillText = document.getElementById("join-pill-text");

    let isSpeakingState = false;
    let toastTimeout = null;

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        if (!res.ok) return;
        const data = await res.json();

        // 1. Títulos de agente
        if (data.banner_title && hdrTitle.textContent !== data.banner_title) {
          hdrTitle.textContent = data.banner_title;
        }
        if (data.banner_subtitle && hdrSubtitle.textContent !== data.banner_subtitle) {
          hdrSubtitle.textContent = data.banner_subtitle;
        }

        // 2. Toast de espectador que entra al live
        if (data.last_joined_user && (Date.now() - (data.last_joined_ts || 0) < 4000)) {
          if (joinPillText) {
            joinPillText.textContent = `👋 ¡${data.last_joined_user} acaba de entrar al dojo!`;
            joinPill.style.display = "flex";
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
              joinPill.style.display = "none";
            }, 3500);
          }
        }

        // 3. Control de Estado de Habla
        const speakingNow = !!data.is_speaking;
        if (speakingNow !== isSpeakingState) {
          isSpeakingState = speakingNow;
          if (speakingNow) {
            document.body.classList.add("is-speaking");
            startSenseiTalkingAnimation(true, data.active_emotion || "SABIO");
            if (bgMusic) bgMusic.volume = 0.01;
          } else {
            document.body.classList.remove("is-speaking");
            startSenseiTalkingAnimation(false, data.active_emotion || "SABIO");
            if (bgMusic) bgMusic.volume = 0.04;
          }
        }

        // 4. Audio
        const audioVer = data.audio_version || 0;
        if (!initialLoadDone) {
          initialLoadDone = true;
          lastAudioVersion = audioVer;
        } else if (audioVer && audioVer !== lastAudioVersion) {
          lastAudioVersion = audioVer;
          reproducirAudioSensei(`/api/live-audio?v=${audioVer}`);
        }

        // 5. Renderizado de Texto con Pregunta Pequeña y Respuesta Prominente
        const phase = data.status_phase || "esperando";
        let u = (data.active_user || "espectador").trim();
        let q = (data.active_question || "").trim();
        let a = (data.active_answer || "").trim();

        if (phase === "pensando") {
          respPrefix.textContent = "CONSULTA EN VIVO";
          respUsername.textContent = u.startsWith("@") ? u : `@${u}`;
          if (respQuestionBox && respQuestionText) {
            respQuestionBox.style.display = "inline-flex";
            respQuestionText.textContent = q ? `«${q}»` : "Analizando dilema...";
          }
          respText.className = "holo-answer-box";
          respText.textContent = "El Sensei está analizando tu caso con sabiduría...";
        } else if (phase === "respondiendo" || phase === "leyendo" || phase === "soporte_escrito") {
          respPrefix.textContent = speakingNow ? "RESPONDIENDO" : "ÚLTIMA RESPUESTA";
          respUsername.textContent = u.startsWith("@") ? u : `@${u}`;

          // Mostrar la pregunta del usuario en letra pequeña
          if (respQuestionBox && respQuestionText && q) {
            respQuestionBox.style.display = "inline-flex";
            respQuestionText.textContent = `«${q}»`;
          } else if (respQuestionBox) {
            respQuestionBox.style.display = "none";
          }

          // Limpiar prefijo repetitivo en el texto de respuesta principal para que solo quede el consejo
          let cleanAnswer = a;
          if (q && cleanAnswer.includes("«") && cleanAnswer.includes("»")) {
            cleanAnswer = cleanAnswer.replace(/^.*?»(?:\.\.\.|\.)?\s*(?:Escucha bien:\s*)?/, "").trim();
          }
          if (!cleanAnswer) cleanAnswer = a;

          respText.className = speakingNow ? "holo-answer-box is-speaking-text" : "holo-answer-box";
          if (u.includes("👑")) respText.classList.add("is-vip");
          respText.textContent = cleanAnswer || "El Sensei está compartiendo su veredicto.";
        } else {
          // Fase esperando
          respPrefix.textContent = "ÚLTIMA RESPUESTA";
          if (respQuestionBox) respQuestionBox.style.display = "none";
          if (a) {
            respUsername.textContent = u.startsWith("@") ? u : `@${u}`;
            respText.className = "holo-answer-box";
            respText.textContent = a;
          } else {
            respUsername.textContent = "@dojo";
            respText.className = "holo-answer-box";
            respText.textContent = "Deja tu caso de amor o pareja en los comentarios y te daré mi veredicto en directo.";
          }
        }

      } catch(err) {
        console.warn("Poll error:", err);
      }
    }

    setInterval(pollStatus, 500);
    pollStatus();
  </script>
</body>
</html>
