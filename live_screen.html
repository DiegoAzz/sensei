<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pantalla de Transmisión en Vivo · TikTok Live Shopping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --pink: #ff2a6d;
      --bg: #07090e;
      --card-bg: rgba(10, 13, 24, 0.78);
      --card-border: rgba(212, 175, 55, 0.35);
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-luxury: 'Cinzel', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: var(--font-body);
      color: #fff;
    }

    /* Contenedor Vertical Adaptable 9:16 para TikTok Live Studio y OBS */
    .stream-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
      background: #030509;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Fondo ambiental dinámico místico y luxury */
    .ambient-stream-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 28%, rgba(255, 42, 109, 0.22) 0%, rgba(212, 175, 55, 0.12) 32%, transparent 70%),
        radial-gradient(circle at 50% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 60%),
        linear-gradient(180deg, #070a14 0%, #030408 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==================== CAPA DE VIDEO / AVATAR ==================== */
    .presenter-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: hidden;
      background: transparent;
    }

    .presenter-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      transition: opacity 0.45s ease-in-out;
    }

    #video-idle {
      opacity: 1;
      z-index: 2;
    }

    #video-talking {
      opacity: 0;
      z-index: 3;
    }

    /* Cuando el agente habla: conmutar videos suavemente */
    body.is-speaking #video-idle {
      opacity: 0;
    }
    body.is-speaking #video-talking {
      opacity: 1;
    }

    /* Capa de Avatar Estático Levitando (Alta Definición) */
    .avatar-static-layer {
      position: absolute;
      top: 19.5%;
      left: 0;
      right: 0;
      height: 28%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .avatar-orb-wrapper {
      position: relative;
      width: clamp(170px, 42vw, 250px);
      height: clamp(170px, 42vw, 250px);
      animation: levitate 3.6s ease-in-out infinite;
    }

    .avatar-halo-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.65);
      animation: rotateHalo 20s linear infinite;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
      z-index: 1;
    }

    @keyframes rotateHalo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-orb-glow {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-glow) 35%, transparent 75%);
      animation: pulseGlow 2.4s ease-in-out infinite;
      z-index: 1;
    }

    body.is-speaking .avatar-orb-glow {
      animation: pulseSpeaking 0.8s ease-in-out infinite;
      background: radial-gradient(circle, var(--cyan-glow) 45%, transparent 80%);
    }

    .avatar-orb-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      border: 4px solid var(--gold);
      box-shadow: 0 15px 45px rgba(0,0,0,0.95), 0 0 35px var(--gold-glow), inset 0 0 25px rgba(212,175,55,0.4);
      z-index: 2;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    body.is-speaking .avatar-orb-img {
      border-color: var(--cyan);
      box-shadow: 0 15px 50px rgba(0,240,255,0.7), 0 0 40px var(--cyan-glow), inset 0 0 30px rgba(0,240,255,0.5);
    }

    @keyframes levitate {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.08); }
    }

    @keyframes pulseSpeaking {
      0%, 100% { opacity: 0.7; transform: scale(1.02); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Viñeta cinematográfica para que los textos siempre resalten */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(4,6,12,0.65) 75%, rgba(2,3,7,0.92) 100%),
                  linear-gradient(180deg, rgba(4,6,12,0.85) 0%, transparent 18%, transparent 58%, rgba(4,6,12,0.95) 90%, #030508 100%);
      z-index: 4;
      pointer-events: none;
    }

    /* ==================== CAPA HUD / INTERFAZ SUPERPUESTA ==================== */
    .hud-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 68px 18px 18px;
      pointer-events: none;
    }

    /* Header Superior */
    .stream-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .top-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ff0044;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.7);
      animation: livePulse 1.8s infinite;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    .store-badge {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      color: #ddd;
    }

    .boutique-title {
      font-family: var(--font-luxury);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 70%, #ffdf79 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--gold-glow);
      text-transform: uppercase;
      line-height: 1.15;
      margin-top: 3px;
    }

    .boutique-sub {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan-glow);
      letter-spacing: 0.5px;
    }

    /* Pop-up de Venta en Vivo Confirmada */
    .sale-alert-popup {
      position: absolute;
      top: 96px;
      left: 18px;
      right: 18px;
      background: linear-gradient(135deg, rgba(20, 24, 12, 0.95), rgba(12, 28, 16, 0.95));
      border: 1.5px solid #00ff88;
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-130px);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      z-index: 30;
    }

    .sale-alert-popup.active {
      transform: translateY(0);
      opacity: 1;
    }

    .sale-alert-icon {
      font-size: 28px;
      animation: bounceSale 0.8s infinite alternate;
    }

    @keyframes bounceSale {
      from { transform: scale(0.9); }
      to { transform: scale(1.15); }
    }

    .sale-alert-text {
      flex: 1;
      font-size: 12px;
      line-height: 1.3;
    }

    .sale-alert-title {
      font-size: 13px;
      font-weight: 900;
      color: #00ff88;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Subtítulos y Pastilla de Pregunta (Ubicados limpiamente debajo del Sensei a top: 50.5%, finito y responsivo) */
    .stream-subtitles-hud {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 50.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 25;
      pointer-events: none;
      box-sizing: border-box;
      max-width: 100%;
    }

    /* 1. Pastilla de Pregunta Compacta (1 sola línea finita y proporcionada) */
    .hud-question-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(5, 7, 15, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.6);
      border-radius: 16px;
      padding: 3px 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      max-width: 92%;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      animation: popIn 0.3s ease-out;
      transition: all 0.3s ease;
    }

    .hud-question-pill.is-vip-donator {
      background: linear-gradient(135deg, rgba(28, 18, 5, 0.95), rgba(12, 8, 2, 0.95));
      border: 1.2px solid #ffd700;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.5);
      animation: vipPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .hud-question-pill.is-vip-donator .hud-q-badge {
      color: #ffd700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.7);
      font-weight: 900;
    }

    @keyframes vipPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hud-q-badge {
      font-size: clamp(9.5px, 2.4vw, 11px);
      font-weight: 800;
      color: var(--cyan);
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    .hud-q-content {
      font-size: clamp(10px, 2.5vw, 11.5px);
      font-weight: 600;
      color: #fff;
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 250px;
    }

    /* 2. Caja de Subtítulo Activo (Finito, responsivo, texto dinámico sin desbordes) */
    .hud-sub-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      width: 100%;
      max-width: 90%;
      box-sizing: border-box;
    }

    .hud-sub-speaker-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      color: #07090e;
      font-size: 8.5px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
      text-transform: uppercase;
    }

    .hud-sub-active-line {
      display: inline-block;
      font-family: var(--font-body);
      font-size: clamp(12.5px, 3.1vw, 14.5px);
      font-weight: 800;
      line-height: 1.32;
      color: #ffffff;
      text-align: center;
      background: rgba(3, 5, 12, 0.92);
      border: 1.2px solid var(--gold);
      border-radius: 10px;
      padding: 5px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.9), 0 0 10px var(--gold-glow);
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.2px;
      max-width: 100%;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
      animation: subPop 0.22s ease-out;
    }

    @keyframes subPop {
      0% { transform: scale(0.92); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes popIn {
      0% { transform: translateY(-8px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 3. Pill de Espera (Finito y centrado) */
    .hud-waiting-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(5, 7, 16, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 16px;
      padding: 4px 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      max-width: 92%;
      box-sizing: border-box;
      animation: pulsePill 2.5s infinite alternate;
    }

    .wait-dot {
      width: 7px;
      height: 7px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    .hud-waiting-pill span {
      font-size: 11px;
      font-weight: 700;
      color: #ddd;
    }

    @keyframes pulsePill {
      0% { border-color: rgba(212, 175, 55, 0.3); }
      100% { border-color: rgba(0, 240, 255, 0.6); }
    }

    .soundwave {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 10px;
    }

    .soundwave-bar {
      width: 2px;
      height: 100%;
      background: #07090e;
      border-radius: 2px;
      animation: soundwaveAnim 0.7s infinite alternate;
    }

    .soundwave-bar:nth-child(2) { animation-delay: 0.2s; }
    .soundwave-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes soundwaveAnim {
      from { height: 2px; }
      to { height: 10px; }
    }

    /* Pastilla VIP Compacta en Top Meta Row (Cero Estorbo) */
    .vip-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(255, 42, 109, 0.45), rgba(212, 175, 55, 0.45));
      border: 1.2px solid rgba(255, 215, 0, 0.85);
      border-radius: 20px;
      padding: 3px 9px;
      box-shadow: 0 0 10px rgba(255, 42, 109, 0.4);
      animation: vipGlow 2.2s ease-in-out infinite alternate;
    }

    @keyframes vipGlow {
      0%, 100% {
        box-shadow: 0 0 8px rgba(255, 42, 109, 0.35);
        border-color: rgba(255, 215, 0, 0.6);
      }
      50% {
        box-shadow: 0 0 16px rgba(255, 215, 0, 0.7), 0 0 22px rgba(255, 42, 109, 0.5);
        border-color: rgba(255, 42, 109, 0.9);
      }
    }

    .vip-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff2a6d;
      box-shadow: 0 0 6px #ff2a6d;
      animation: pulseDot 1s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.85); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    .vip-text {
      font-size: 10px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.7);
    }

    /* Barra Inferior de Llamado a la Acción */
    .cta-bar {
      background: rgba(8, 12, 22, 0.88);
      border: 1.2px solid rgba(212, 175, 55, 0.45);
      border-radius: 10px;
      padding: 6px 12px;
      text-align: center;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .cta-text {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Botón flotante para activar audio (oculto en stream) */
    .audio-toggle-btn {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="stream-viewport">

    <!-- FONDO AMBIENTAL DE ALTA DEFINICIÓN -->
    <div class="ambient-stream-bg"></div>

    <!-- CAPA 1: PRESENTADOR (VIDEOS HÍBRIDOS O AVATAR ESTÁTICO LEVITANDO) -->
    <div class="presenter-container">
      <video id="video-idle" class="presenter-video" loop muted playsinline autoplay style="display: none;"></video>
      <video id="video-talking" class="presenter-video" loop muted playsinline style="display: none;"></video>

      <!-- Capa de Avatar Estático Levitando (Siempre visible con El Sensei) -->
      <div id="avatar-static-layer" class="avatar-static-layer" style="display: flex;">
        <div class="avatar-orb-wrapper">
          <div class="avatar-halo-ring"></div>
          <div class="avatar-orb-glow"></div>
          <img id="avatar-static-img" class="avatar-orb-img" src="/assets/logo_sensei.jpg" alt="El Sensei">
        </div>
      </div>
    </div>

    <!-- CAPA 2: VIÑETA CINEMATOGRÁFICA -->
    <div class="vignette-overlay"></div>

    <!-- BOTÓN DE SONIDO PARA NAVEGADOR -->
    <button class="audio-toggle-btn" id="btn-unmute" onclick="activarAudio()">
      🔊 Escuchar Audio
    </button>
    <!-- MÚSICA MÍSTICA DE FONDO (CONTINUA EN TIKTOK LIVE) -->
    <audio id="bg-music" src="/assets/musica_misteriosa.mp3" loop preload="auto"></audio>

    <!-- CAPA 3: HUD E INTERFAZ FLOTANTE -->
    <div class="hud-layer">

      <!-- HEADER SUPERIOR -->
      <header class="stream-header">
        <div class="top-meta-row">
          <div class="live-badge">
            <span class="live-dot"></span>
            <span>LIVE</span>
          </div>
          <div class="store-badge" id="hud-store-badge">COLOMBIA 🇨🇴</div>
          <div class="vip-badge" id="hud-vip-badge">
            <span class="vip-pulse-dot"></span>
            <span class="vip-text" id="hud-vip-text">🌹 1 ROSA = VIP</span>
          </div>
        </div>
        <h1 class="boutique-title" id="hud-title">~ EL SENSEI DEL AMOR ~</h1>
        <p class="boutique-sub" id="hud-subtitle">Conquista · Infidelidad · Parejas · Amor Propio</p>
      </header>

      <!-- POPUP FLOTANTE DE VENTA EN VIVO -->
      <div class="sale-alert-popup" id="sale-popup">
        <div class="sale-alert-icon">🛍️</div>
        <div class="sale-alert-text">
          <div class="sale-alert-title">¡VENTA EN DIRECTO CONFIRMADA!</div>
          <div id="sale-popup-desc" style="color: #eee;">Carlos de Medellín acaba de pedir Lattafa Yara 100ml</div>
        </div>
      </div>

      <!-- ==================== SUBTÍTULOS DINÁMICOS PROFESIONALES (TIPO CAPCUT / TIKTOK VIRAL) ==================== -->
      <div class="stream-subtitles-hud" id="stream-subtitles-hud">

        <!-- 1. Pastilla de Pregunta Compacta (1 sola línea) -->
        <div class="hud-question-pill" id="card-question" style="display: none;">
          <span class="hud-q-badge" id="card-q-user">👤 @usuario</span>
          <span class="hud-q-content" id="card-q-text">"¿Pregunta?"</span>
        </div>

        <!-- 2. Subtítulo Dinámico (1 frase grande que cambia mientras habla) -->
        <div class="hud-sub-box" id="card-answer" style="display: none;">
          <div class="hud-sub-speaker-tag">
            <span id="card-ans-speaker">⛩️ EL SENSEI</span>
            <span class="soundwave">
              <span class="soundwave-bar"></span>
              <span class="soundwave-bar"></span>
              <span class="soundwave-bar"></span>
            </span>
          </div>
          <div class="hud-sub-active-line" id="card-ans-text">
            <!-- Frase actual sincronizada -->
          </div>
        </div>

        <!-- 3. Pill de Espera -->
        <div class="hud-waiting-pill" id="card-waiting">
          <span class="wait-dot"></span>
          <span id="card-waiting-sub">⛩️ Deja tu dilema en los comentarios y te respondo en vivo 👇</span>
        </div>

      </div>

    </div>

  </div>

  <script>
    const vidIdle = document.getElementById("video-idle");
    const vidTalking = document.getElementById("video-talking");
    const avatarStaticLayer = document.getElementById("avatar-static-layer");
    const avatarStaticImg = document.getElementById("avatar-static-img");

    const hudTitle = document.getElementById("hud-title");
    const hudSubtitle = document.getElementById("hud-subtitle");
    const hudCta = document.getElementById("hud-cta");
    const hudStoreBadge = document.getElementById("hud-store-badge");

    const cardQuestion = document.getElementById("card-question");
    const cardQUser = document.getElementById("card-q-user");
    const cardQText = document.getElementById("card-q-text");

    const cardAnswer = document.getElementById("card-answer");
    const cardAnsSpeaker = document.getElementById("card-ans-speaker");
    const cardAnsText = document.getElementById("card-ans-text");

    const cardWaiting = document.getElementById("card-waiting");
    const cardWaitingSub = document.getElementById("card-waiting-sub");

    const salePopup = document.getElementById("sale-popup");
    const salePopupDesc = document.getElementById("sale-popup-desc");
    const btnUnmute = document.getElementById("btn-unmute");
    const bgMusic = document.getElementById("bg-music");
    if (bgMusic) {
      bgMusic.volume = 0.09; // Volumen suave ambiental para evitar ruido o distorsión
    }

    let currentAgentId = null;
    let isSpeakingState = false;
    let currentIdleSrc = "";
    let currentTalkSrc = "";
    let lastSaleId = null;
    let lastAudioVersion = 0;
    let initialAudioLoaded = false;
    let currentSpeechAudio = null;

    function reproducirVozSensei(audioUrl) {
      if (currentSpeechAudio) {
        try {
          currentSpeechAudio.pause();
          currentSpeechAudio.currentTime = 0;
          currentSpeechAudio.src = "";
        } catch(e) {}
      }
      currentSpeechAudio = new Audio(audioUrl);
      currentSpeechAudio.volume = 1.0;
      currentSpeechAudio.play().catch(e => {
        console.warn("Aviso play voz:", e);
      });
    }

    function activarAudio() {
      // Los videos de presentador siempre permanecen muteados para que no metan estática ni ruido
      vidIdle.muted = true;
      vidTalking.muted = true;
      if (bgMusic && bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
      btnUnmute.style.opacity = "0";
      setTimeout(() => { btnUnmute.style.display = "none"; }, 350);
    }

    document.addEventListener("click", () => {
      activarAudio();
    }, { once: true });

    // ==================== MOTOR DE SUBTÍTULOS DINÁMICOS ====================
    let currentSubtitleInterval = null;
    let lastRenderedAnswer = "";
    let tsLastAnswerStart = 0;

    function splitTextIntoSubtitles(text) {
      const clean = text.replace(/\[[A-Z_]+\]/g, "").replace(/^["'“”]/, "").replace(/["'“”]$/, "").trim();
      const words = clean.split(/\s+/);
      const segments = [];
      let current = [];
      for (let i = 0; i < words.length; i++) {
        current.push(words[i]);
        const w = words[i];
        const endsWithPunct = /[.,!?;:]$/.test(w);
        if ((endsWithPunct && current.length >= 2) || current.length >= 4 || i === words.length - 1) {
          segments.push(current.join(" "));
          current = [];
        }
      }
      return segments.length > 0 ? segments : [clean];
    }

    function iniciarSubtitulosDinamicos(fullText) {
      if (currentSubtitleInterval) {
        clearInterval(currentSubtitleInterval);
        currentSubtitleInterval = null;
      }
      const segments = splitTextIntoSubtitles(fullText);
      let idx = 0;

      function renderNextSegment() {
        if (idx < segments.length) {
          cardAnsText.textContent = segments[idx];
          cardAnsText.style.animation = "none";
          void cardAnsText.offsetWidth;
          cardAnsText.style.animation = "subPop 0.22s ease-out";
          idx++;
        }
      }

      renderNextSegment();
      currentSubtitleInterval = setInterval(() => {
        if (idx < segments.length) {
          renderNextSegment();
        } else {
          clearInterval(currentSubtitleInterval);
          currentSubtitleInterval = null;
        }
      }, 1250);
    }

    async function pollStatus() {
      try {
        const resp = await fetch("/api/status");
        if (!resp.ok) return;
        const data = await resp.json();

        // 1. Configuración del Agente y Tema
        if (data.id !== currentAgentId) {
          currentAgentId = data.id;
          hudTitle.textContent = data.banner_title || data.name || "~ EN VIVO ~";
          hudSubtitle.textContent = data.banner_subtitle || data.niche || "";
          hudCta.textContent = data.call_to_action || "📦 Pide el tuyo en el enlace de la biografía";

          hudStoreBadge.textContent = data.store_name ? data.store_name.slice(0, 24) : "COLOMBIA 🇨🇴";
          cardAnsSpeaker.textContent = (data.name || "ASESOR").split("·")[0].trim().toUpperCase();

          if (cardWaitingSub) {
            if (data.type === "tienda_ventas") {
              cardWaitingSub.textContent = data.call_to_action || "Pide tu perfume árabe favorito o clon de diseñador y te respondemos en vivo.";
            } else {
              cardWaitingSub.textContent = "⛩️ Deja tu dilema en el chat · 🌹 1 Rosa = Consulta VIP Prioritaria 👇";
            }
          }

          if (data.theme_color) {
            document.documentElement.style.setProperty("--gold", data.theme_color);
          }
          if (data.accent_color) {
            document.documentElement.style.setProperty("--cyan", data.accent_color);
          }

          // Cargar videos si el agente es tipo video_loop
          if (data.avatar_type === "video_loop" && data.video_idle) {
            avatarStaticLayer.style.display = "none";
            vidIdle.style.display = "block";
            vidTalking.style.display = "block";

            if (currentIdleSrc !== data.video_idle) {
              currentIdleSrc = data.video_idle;
              vidIdle.src = data.video_idle;
              vidIdle.play().catch(() => {});
            }
            if (currentTalkSrc !== (data.video_talking || data.video_idle)) {
              currentTalkSrc = data.video_talking || data.video_idle;
              vidTalking.src = currentTalkSrc;
              vidTalking.play().catch(() => {});
            }
          } else {
            // Modo avatar estático
            vidIdle.style.display = "none";
            vidTalking.style.display = "none";
            avatarStaticLayer.style.display = "flex";
            if (data.avatar) {
              avatarStaticImg.src = data.avatar;
            } else {
              avatarStaticImg.src = "/assets/logo_sensei.jpg";
            }
          }
        }

        // 2. Reproducir audio de respuesta en tiempo real (anti-eco y sin repetir al actualizar)
        if (!initialAudioLoaded) {
          initialAudioLoaded = true;
          lastAudioVersion = data.audio_version || 0;
        } else if (data.audio_version && data.audio_version !== lastAudioVersion) {
          lastAudioVersion = data.audio_version;
          reproducirVozSensei(`/api/live-audio?v=${data.audio_version}`);
        }

        // 3. Control de Estado de Habla (Talking vs Idle) con Ducking de Música
        const speakingNow = !!data.is_speaking;
        if (speakingNow !== isSpeakingState) {
          isSpeakingState = speakingNow;
          if (speakingNow) {
            document.body.classList.add("is-speaking");
            if (vidTalking.paused) vidTalking.play().catch(() => {});
            // Ducking: atenuar suavemente la música de fondo al 2% mientras habla El Sensei
            if (bgMusic) bgMusic.volume = 0.02;
          } else {
            document.body.classList.remove("is-speaking");
            // Restaurar volumen normal de música ambiental (9%) en momentos de espera
            if (bgMusic) bgMusic.volume = 0.09;
          }
        }

        // Asegurar que la música mística de fondo suene continuamente en TikTok Live
        if (bgMusic && bgMusic.paused) {
          bgMusic.play().catch(() => {});
        }

        // 4. Control de Subtítulos y Pregunta en Pantalla
        const phase = data.status_phase || "esperando";

        if (phase === "pensando") {
          cardWaiting.style.display = "none";
          cardQuestion.style.display = "inline-flex";
          let rawU = (data.active_user || 'espectador').replace(/GANCHO VIRAL/gi, "SABIDURÍA").trim();
          let rawQ = (data.active_question || '...').replace(/GANCHO VIRAL/gi, "").trim();
          if (rawU.includes("👑")) {
            cardQuestion.classList.add("is-vip-donator");
          } else {
            cardQuestion.classList.remove("is-vip-donator");
          }
          if (rawU.includes("👑") || rawU.includes("🔥") || rawU.includes("🎁") || rawU.includes("👤") || rawU.includes("⛩️")) {
            cardQUser.textContent = rawU;
          } else {
            cardQUser.textContent = `👤 @${rawU}`;
          }
          cardQText.textContent = rawQ ? `"${rawQ}"` : '';
          cardAnswer.style.display = "none";
          if (currentSubtitleInterval) { clearInterval(currentSubtitleInterval); currentSubtitleInterval = null; }
          lastRenderedAnswer = "";

        } else if (phase === "respondiendo" || phase === "leyendo" || phase === "soporte_escrito") {
          cardWaiting.style.display = "none";
          cardQuestion.style.display = "inline-flex";
          let rawU = (data.active_user || 'espectador').replace(/GANCHO VIRAL/gi, "SABIDURÍA").trim();
          let rawQ = (data.active_question || '').replace(/GANCHO VIRAL/gi, "").trim();
          if (rawU.includes("👑")) {
            cardQuestion.classList.add("is-vip-donator");
          } else {
            cardQuestion.classList.remove("is-vip-donator");
          }
          if (rawU.includes("👑") || rawU.includes("🔥") || rawU.includes("🎁") || rawU.includes("👤") || rawU.includes("⛩️")) {
            cardQUser.textContent = rawU;
          } else {
            cardQUser.textContent = `👤 @${rawU}`;
          }
          cardQText.textContent = rawQ ? `"${rawQ}"` : '';

          cardAnswer.style.display = "flex";
          const ans = data.active_answer || "...";
          if (phase === "soporte_escrito") {
            // Modo Soporte Escrito: texto fino y compacto sin desbordar la pantalla
            if (currentSubtitleInterval) { clearInterval(currentSubtitleInterval); currentSubtitleInterval = null; }
            cardAnsSpeaker.textContent = "⛩️ CONSEJO FINAL";
            if (ans.length > 85) {
              cardAnsText.textContent = ans.slice(0, 82) + "...";
            } else {
              cardAnsText.textContent = ans;
            }
          } else if (ans !== lastRenderedAnswer) {
            lastRenderedAnswer = ans;
            tsLastAnswerStart = Date.now();
            cardAnsSpeaker.textContent = (data.name || "SENSEI").split("·")[0].trim().toUpperCase();
            iniciarSubtitulosDinamicos(ans);
          } else if (phase === "respondiendo" && (Date.now() - tsLastAnswerStart) > 22000) {
            // Protección anti-congelamiento local: si el subtítulo lleva más de 22s, devolver pantalla a espera
            cardWaiting.style.display = "inline-flex";
            cardQuestion.style.display = "none";
            cardAnswer.style.display = "none";
            if (currentSubtitleInterval) { clearInterval(currentSubtitleInterval); currentSubtitleInterval = null; }
          }

        } else {
          // Fase esperando
          cardWaiting.style.display = "inline-flex";
          cardQuestion.style.display = "none";
          cardAnswer.style.display = "none";
          if (currentSubtitleInterval) { clearInterval(currentSubtitleInterval); currentSubtitleInterval = null; }
          lastRenderedAnswer = "";
        }

        // 5. Pop-up de Venta en Vivo
        if (data.last_sale_alert && data.last_sale_alert.id !== lastSaleId) {
          lastSaleId = data.last_sale_alert.id;
          const a = data.last_sale_alert;
          salePopupDesc.textContent = `${a.cliente} (${a.ciudad}) acaba de pedir: ${a.producto} (${a.precio}) · ¡Quedan pocas unidades!`;
          salePopup.classList.add("active");
          setTimeout(() => {
            salePopup.classList.remove("active");
          }, 9000);
        }

      } catch (err) {
        // Silenciar errores de red
      }
    }

    // Polling ágil a 450ms: ultra reactivo y estable sin saturar el socket
    setInterval(pollStatus, 450);
    pollStatus();
  </script>
</body>
</html>
